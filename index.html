<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e131a">
<title>Comandas</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0e131a; --bg2:#131b25; --card:#1a2432; --card2:#22303f; --card3:#2a3a4c;
  --line:#2c3a4d; --line2:#3a4c62;
  --txt:#eaf1fa; --mut:#8fa2ba; --mut2:#6b7f99;
  --acc:#ffb020; --acc2:#ffc95c; --acc-d:#241800;
  --ok:#4fe0a0; --warn:#ff6b6b; --info:#5cb8ff;
  --r:16px; --r2:12px;
  --sh:0 2px 8px rgba(0,0,0,.28);
  --sh2:0 8px 28px rgba(0,0,0,.42);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;
  -webkit-font-smoothing:antialiased}
body{padding:0 0 92px;min-height:100vh;
  background-image:radial-gradient(900px 420px at 50% -180px,rgba(255,176,32,.07),transparent 70%)}
#app{max-width:680px;margin:0 auto;padding:20px 16px 8px;animation:fade .22s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}

h1{font-size:23px;margin:0 0 14px;font-weight:800;letter-spacing:-.02em}
h2{font-size:12px;margin:24px 0 10px;color:var(--mut);font-weight:700;
  text-transform:uppercase;letter-spacing:.08em}
p{margin:8px 0;line-height:1.55}
.mut{color:var(--mut);font-size:13px}
.brand{display:flex;align-items:center;gap:11px;font-size:25px;font-weight:800;
  margin-bottom:18px;letter-spacing:-.02em}
.brand svg{flex:0 0 auto;filter:drop-shadow(0 3px 10px rgba(255,176,32,.28))}
.empty{color:var(--mut);text-align:center;padding:30px 14px;font-size:14px;
  background:var(--bg2);border:1px dashed var(--line);border-radius:var(--r);line-height:1.6}

.row{display:flex;gap:9px;margin:9px 0;align-items:center}
input,select,textarea{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);
  color:var(--txt);border-radius:var(--r2);padding:12px 13px;font-size:15px;
  font-family:inherit;transition:border-color .16s,background .16s}
input::placeholder,textarea::placeholder{color:var(--mut2)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);background:var(--card3)}
input.qty{flex:0 0 78px;text-align:center}
textarea{width:100%;resize:vertical;line-height:1.55}
input.title{font-size:20px;font-weight:800;margin-bottom:12px;width:100%;
  background:transparent;border:0;border-bottom:2px solid var(--line);border-radius:0;padding:8px 2px}
input.title:focus{border-color:var(--acc);background:transparent}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),
  linear-gradient(135deg,var(--mut) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}

button{background:linear-gradient(180deg,var(--acc2),var(--acc));color:var(--acc-d);
  border:0;border-radius:var(--r2);padding:12px 17px;font-size:15px;font-weight:700;
  font-family:inherit;cursor:pointer;white-space:nowrap;
  transition:transform .12s var(--ease),filter .16s,opacity .16s;
  box-shadow:0 2px 10px rgba(255,176,32,.22)}
button:active{transform:scale(.965);filter:brightness(.94)}
button.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line);
  box-shadow:none;font-weight:600}
button.ghost:active{background:var(--card3)}
button.warn{background:transparent;color:var(--warn);border:1px solid var(--warn);
  box-shadow:none;font-weight:600}
button.warn:active{background:rgba(255,107,107,.12)}
button.link{background:none;color:var(--acc);padding:8px 0;font-weight:700;
  box-shadow:none;font-size:15px}
button:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}

.card{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 15px;margin:9px 0;color:var(--txt);font-weight:400;
  box-shadow:var(--sh);transition:transform .14s var(--ease),border-color .16s,background .16s}
.card:active{transform:scale(.985);border-color:var(--line2);background:var(--card2)}
.card .av{flex:0 0 40px;height:40px;border-radius:12px;
  background:linear-gradient(150deg,var(--acc2),var(--acc));color:var(--acc-d);
  display:flex;align-items:center;justify-content:center;font-weight:800;
  font-size:18px;font-style:normal;box-shadow:0 2px 8px rgba(255,176,32,.2)}
.card .cn{flex:1;font-size:15px;font-weight:600;line-height:1.4;min-width:0}
.card .cn .mut{display:block;margin-top:3px}
.card b{font-size:16px;color:var(--acc);white-space:nowrap;font-weight:800}

.line{display:flex;align-items:center;gap:11px;padding:13px 2px;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .nm{flex:1;font-size:15px;line-height:1.45;min-width:0}
.line .nm small{display:block;color:var(--mut);font-size:12px;margin-top:3px}
.line b{font-size:15px;white-space:nowrap;font-weight:700}
.line input{background:transparent;border:0;padding:4px 0;border-radius:0;border-bottom:1px solid transparent}
.line input:focus{background:transparent;border-bottom-color:var(--acc)}
.line .qty{flex:0 0 68px;background:var(--card2);border:1px solid var(--line);
  border-radius:9px;padding:8px;text-align:center}

.total{display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(150deg,var(--card),var(--bg2));
  border:1px solid var(--line2);border-radius:var(--r);
  padding:16px 18px;margin:16px 0;font-size:18px;font-weight:800;box-shadow:var(--sh)}
.total span:last-child{color:var(--acc);font-size:20px}

.seg{display:flex;gap:7px;margin:14px 0;background:var(--bg2);padding:5px;
  border-radius:14px;border:1px solid var(--line)}
.seg button{flex:1;background:transparent;color:var(--mut);border:0;
  font-weight:700;font-size:14px;box-shadow:none;padding:10px}
.seg button.on{background:var(--card3);color:var(--acc);box-shadow:var(--sh)}
.seg.pay{background:transparent;border:0;padding:0;flex-wrap:wrap;gap:8px}
.seg.pay button{flex:1 1 46%;background:var(--card);color:var(--txt);
  border:1px solid var(--line);box-shadow:var(--sh);padding:14px}
.seg.pay button:active{background:var(--card2)}

.search{position:relative;margin:12px 0}
.search input{padding-left:38px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  color:var(--mut2);pointer-events:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px;margin:12px 0}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;
  gap:8px;min-height:88px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:12px;text-align:left;color:var(--txt);
  font-weight:600;font-size:13.5px;line-height:1.3;box-shadow:var(--sh);
  transition:transform .12s var(--ease),border-color .16s,background .16s;overflow:hidden}
.tile:active{transform:scale(.95);border-color:var(--acc);background:var(--card2)}
.tile .tp{color:var(--acc);font-weight:800;font-size:14px}
.tile .badge{position:absolute;top:7px;right:7px;min-width:22px;height:22px;
  border-radius:11px;background:var(--acc);color:var(--acc-d);font-size:12px;
  font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 6px;
  animation:pop .18s var(--ease)}
.tile .stk{font-size:11px;font-weight:700;color:var(--ok)}
.tile .stk.low{color:var(--acc)}
.tile .stk.zero{color:var(--warn)}
.tile.off{opacity:.42}
.tile.off:active{transform:none;border-color:var(--line);background:var(--card)}

.alert{display:flex;align-items:center;gap:11px;background:rgba(255,107,107,.1);
  border:1px solid rgba(255,107,107,.35);border-radius:var(--r2);
  padding:12px 14px;margin:12px 0;font-size:14px;line-height:1.45}
.alert svg{color:var(--warn);flex:0 0 auto}
.alert.ok{background:rgba(79,224,160,.09);border-color:rgba(79,224,160,.32)}
.alert.ok svg{color:var(--ok)}

#nav{position:fixed;bottom:0;left:0;right:0;background:rgba(19,27,37,.94);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:flex;padding:7px 6px 9px;
  padding-bottom:calc(9px + env(safe-area-inset-bottom));z-index:20}
#nav button{flex:1;background:none;color:var(--mut2);display:flex;flex-direction:column;
  align-items:center;gap:4px;font-size:10px;font-weight:700;padding:7px 2px;
  border-radius:12px;box-shadow:none;transition:color .16s,background .16s}
#nav button.on{color:var(--acc);background:rgba(255,176,32,.09)}
#nav button:active{transform:none;background:rgba(255,176,32,.14)}
#nav button span{font-size:10px;letter-spacing:.01em}
@media(min-width:700px){#nav{max-width:680px;left:50%;transform:translateX(-50%);
  border-radius:18px 18px 0 0;border:1px solid var(--line);border-bottom:0}}

#scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;
  opacity:0;pointer-events:none;transition:opacity .22s var(--ease)}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--bg2);
  border-top:1px solid var(--line2);border-radius:22px 22px 0 0;
  padding:10px 16px calc(20px + env(safe-area-inset-bottom));
  box-shadow:var(--sh2);transform:translateY(102%);
  transition:transform .26s var(--ease);max-width:680px;margin:0 auto}
#sheet.on{transform:none;animation:sheet .26s var(--ease)}
#sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:4px auto 14px}
#sheet h2{margin-top:0}
#sheet button.mi{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:var(--card);color:var(--txt);border:1px solid var(--line);
  border-radius:var(--r2);padding:14px 15px;margin:8px 0;font-weight:600;
  font-size:15px;box-shadow:var(--sh)}
#sheet button.mi:active{background:var(--card2);transform:none}
#sheet button.mi svg{color:var(--acc);flex:0 0 auto}
#sheet button.mi small{display:block;color:var(--mut);font-size:12px;font-weight:400;margin-top:2px}

.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);
  background:var(--card3);border:1px solid var(--line2);color:var(--txt);
  padding:12px 18px;border-radius:14px;font-size:14px;z-index:40;
  box-shadow:var(--sh2);max-width:min(92vw,420px);text-align:center;
  animation:pop .22s var(--ease);word-break:break-word}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<div id="scrim"></div>
<div id="sheet"></div>

<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyAMRbOipfikaylNDUmwYE6ZwOd0fhwRw-0",
  authDomain: "comanda-legal.firebaseapp.com",
  projectId: "comanda-legal",
  storageBucket: "comanda-legal.firebasestorage.app",
  messagingSenderId: "1061673474266",

};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, collection, setDoc, addDoc, deleteDoc, getDoc, getDocs,
         onSnapshot, writeBatch }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: "select_account" });
const entrarComGoogle = () => signInWithPopup(auth, provider);
const sair            = () => signOut(auth);
  async function criarGrupo({ nome }) {
  const lojaId = crypto.randomUUID().slice(0, 8);
  const b = writeBatch(db);
  b.set(doc(db, 'lojas', lojaId), { nome, dono: USER.uid, criadoEm: Date.now() });
  b.set(doc(db, 'lojas', lojaId, 'membros', USER.uid),
        { email: USER.email, nome: USER.name || USER.email, papel: 'dono' });
  b.set(doc(db, 'usuarios', USER.uid), { lojaId });
  await b.commit();
  return { data: { lojaId } };
}

async function gerarConvite({ lojaId }) {
  const token = crypto.randomUUID().replace(/-/g, '').slice(0, 20);
  await setDoc(doc(db, 'convites', token), {
    lojaId, criadoPor: USER.uid, criadoEm: Date.now(), usado: false
  });
  return { data: { token } };
}

async function aceitarConvite({ lojaId, token }) {
  const cRef = doc(db, 'convites', token);
  const c = await getDoc(cRef);
  if (!c.exists()) throw { code: 'not-found' };
  if (c.data().usado) throw { code: 'already-exists' };

  const ms = await getDocs(collection(db, 'lojas', lojaId, 'membros'));
  if (ms.size >= 5) throw { code: 'failed-precondition' };

  const b = writeBatch(db);
  b.set(doc(db, 'lojas', lojaId, 'membros', USER.uid),
        { email: USER.email, nome: USER.name || USER.email, papel: 'membro' });
  b.set(doc(db, 'usuarios', USER.uid), { lojaId });
  b.update(cRef, { usado: true, usadoPor: USER.uid });
  await b.commit();
  return { data: { lojaId } };
}

async function removerMembro({ lojaId, uid }) {
  const b = writeBatch(db);
  b.delete(doc(db, 'lojas', lojaId, 'membros', uid));
  b.delete(doc(db, 'usuarios', uid));
  await b.commit();
  return { data: {} };
                                            }
